plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.25'
}

// 1. 补全读取 Git Commit Hash 的方法
static def getCheckedOutGitCommitHash(Project mcefParent) {
    def gitFolder = "$mcefParent.projectDir/.git/modules/java-cef/"
    def takeFromHash = 40
    def gitHeadFile = new File(gitFolder + "HEAD")
    if (gitHeadFile.exists()) {
        def head = gitHeadFile.text.split(":")
        def isCommit = head.length == 1

        if (isCommit) return head[0].trim().take(takeFromHash)

        def refHead = new File(gitFolder + head[1].trim())
        if (refHead.exists()) {
            return refHead.text.trim().take(takeFromHash)
        } else {
            return ""
        }
    } else {
        return ""
    }
}

// 注册 JCEF 相关的构建和克隆任务
tasks.register('cloneJcef', Exec) {
    commandLine 'git', 'submodule', 'update', '--init', '--recursive', 'java-cef'
}

tasks.register('generateJcefCommitFile') {
    doLast {
        def commitHash = getCheckedOutGitCommitHash(project)
        if (!commitHash.isEmpty()) {
            // 使用标准的 Gradle 路径 API 获取文件
            layout.buildDirectory.file("jcef.commit").get().asFile.text = commitHash
        } else {
            throw new GradleException("Unable to determine JCEF commit hash.")
        }
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// 2. 修复 SourceSets 结构：将 jcef 移出 resources，并正确关联到 main 的 classpath
sourceSets {
    jcef {
        java {
            srcDir "java-cef/java"
            exclude "**/tests/**"
        }
    }
    main {
        resources {
            srcDir('src/generated/resources')
            exclude("**/*.bbmodel")
            exclude("src/generated/**/.cache")
        }
        compileClasspath += jcef.output
        runtimeClasspath += jcef.output
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://cursemaven.com' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation 'org.json:json:20251224'
    jarJar 'org.json:json:20251224'

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.lwjgl:lwjgl-egl:3.3.3"

    // 3. 移除 `implementation project(':java-cef')`
    // 因为我们已经在 sourceSets 里面以独立编译集的方式包含了 JCEF
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            'java-cef-commit'      : getCheckedOutGitCommitHash(project)
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    dependsOn generateJcefCommitFile
}

// 4. 确保在最终生成的 jar 包中包含 JCEF 编译后的内容
tasks.named('jar', Jar).configure {
    from sourceSets.jcef.output.classesDirs
    from sourceSets.jcef.output.resourcesDir
    // 直接传入 Gradle 文件对象，无需转换为绝对路径字符串
    from layout.buildDirectory.file("jcef.commit")
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
        excludeDirs += file("java-cef/java/tests")
    }
}